[tool.poetry]
name = "ska-tmc-centralnode"
version = "0.5.0"
description = "Central Node is a coordinator of the complete M&C system"
authors = ["Team SAHYADRI & Team HIMALAYA <telmgt-internal@googlegroups.com>"]
license = "BSD-3-Clause"
packages = [
    { include = "ska_tmc_centralnode", from = "src" }
]
include = [
    { path = 'tests'}
]

[tool.poetry.scripts]
CentralNodeDS = 'ska_tmc_centralnode.central_node_mid:main'

[[tool.poetry.source]]
name = 'ska-nexus'
url = 'https://artefact.skao.int/repository/pypi-internal/simple'

[tool.poetry.dependencies]
python = "^3.10"
jsonschema = "^4.0.1"
marshmallow = "^3.13.0"
fire = "^0.4.0"
numpy = "1.23.0"
pytango = "^9.3.3"
ska-ser-logging = "^0.4.1"
ska-tango-base = "0.13.3"
ska-tmc-cdm = "7.3.1"
ska-tmc-common = "0.1.54"
ska-tango-testing = "0.4.1"
ska-ser-log-transactions = "*"
ska-ser-skuid = "*"
mock = "^4.0.3"
pandas="1.4.2"
ipython = "8.5.0"
ska-control-model="0.3.1"

[tool.poetry.dev-dependencies]
black = "^22.8.0"
isort = "^5.10.1"
flake8 = "^5.0.4"
pylint = "^2.12.2"
pytest = "^7.1"
pytest-bdd = "^5.0.0"
pytest-cov = "^2.10.1"
pylint-junit = "^0.3.2"
coverage = "^6.1.1"
pytest-json-report = "^1.4.1"
pytest-forked = "^1.3.0"
pytest-mock = "^3.6.1"
pytest-xdist = "^2.4.0"
pytest-repeat = "^0.9.1"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 79

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
