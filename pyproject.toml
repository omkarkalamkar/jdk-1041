[tool.poetry]
name = "ska-tmc-centralnode"
version = "1.7.1"
description = "Central Node is a coordinator of the complete M&C system"
authors = ["Team SAHYADRI & Team HIMALAYA <telmgt-internal@googlegroups.com>"]
license = "BSD-3-Clause"
packages = [{ include = "ska_tmc_centralnode", from = "src" }]
include = [{ path = 'tests' }]

[tool.poetry.scripts]
MidTmcCentralNode = 'ska_tmc_centralnode.central_node_mid:main'
LowTmcCentralNode = 'ska_tmc_centralnode.central_node_low:main'

[[tool.poetry.source]]
name = 'ska-nexus'
url = 'https://artefact.skao.int/repository/pypi-internal/simple'

[[tool.poetry.source]]
name = "PyPI-public"
url = 'https://pypi.org/simple'

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
marshmallow = "^3.14.1"
fire = ">=0.5.0,<0.6.0"
numpy = "^1.23.0"
pytango = "10.3.0"
ska-ser-logging = "^0.4.1"
ska-tango-base = "1.4.0"
ska-tmc-cdm = "14.9.0"
ska-tmc-common = "1.15.2"
ska-ser-log-transactions = "*"
mock = "^4.0.3"
katpoint = "1.0a2"
pandas = "1.4.2"
ipython = "8.5.0"
ska-telmodel = "1.33.0"
ska-control-model = "1.2.0"
attrs = "^23.2.0"
referencing = "^0.35.0"
jsonschema-specifications = "^2023.12.1"
rpds-py = ">=0.25.0"
retry2 = "0.9.5"
rule-engine = "^4.5.0"
tenacity = "^8.5.0"
astropy = "6.1.7"
astroid = "3.2.4"
ska-schemas = "1.36.0"


[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
isort = "^5.10.1"
flake8 = "^5.0.4"
pylint = "3.2.7"
pytest = "^7.3.1"
pytest-bdd = "^5.0.0"
pytest-cov = "6.3.0"
pylint-junit = "^0.3.2"
coverage = "7.5.0"
pytest-json-report = "^1.4.1"
pytest-forked = "^1.3.0"
pytest-mock = "^3.10.0"
pytest-xdist = "^2.4.0"
pytest-repeat = "^0.9.1"
ska-tmc-simulators = "1.9.5"
ska-tango-testing = "0.8.0"
mypy = "2.3.0"

[tool.poetry.group.docs.dependencies]
docutils = "^0.18.1"
Sphinx = "^5.1.1"
ska-ser-sphinx-theme = "^0.1.1"
sphinx-autodoc-typehints = "^1.19.3"
sphinxcontrib-plantuml = "^0.22"
typing_extensions = "^4.3.0"
sphinx-rtd-theme = "^1.2.2"
recommonmark = "^0.7.1"
ska-tango-difdoc = "^0.3.0"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 79

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disable_error_code = ["import-untyped"]
files = ["src/ska_tmc_centralnode/manager", "src/ska_tmc_centralnode/refactored_commands"]