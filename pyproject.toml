[tool.poetry]
name = "ska-tmc-centralnode"
version = "0.3.3"
description = "Central Node is a coordinator of the complete M&C system"
authors = ["Team NCRA <telmgt-internal@googlegroups.com>"]
license = "BSD-3-Clause"
packages = [
    { include = "ska_tmc_centralnode", from = "src" }
]
include = [
    { path = 'tests'}
]


[tool.poetry.scripts]
CentralNodeDS = 'ska_tmc_centralnode.central_node_mid:main'

[[tool.poetry.source]]
name = 'ska-nexus'
url = 'https://artefact.skao.int/repository/pypi-internal/simple'

[tool.poetry.dependencies]
python = "^3.7"
jsonschema = "^4.0.1"
marshmallow = "^3.13.0"
fire = "^0.4.0"
numpy = "1.17.2"
pytango = "^9.3.3"
ska-ser-logging = "^0.4.1"
ska-tango-base = "^0.11.3"
ska-tmc-cdm = "*"
ska-tmc-common = "*"
ska-ser-log-transactions = "*"
ska-ser-skuid = "*"
mock = "^4.0.3"

[tool.poetry.dev-dependencies]
black = "^20.8b1"
pylint = "^2.6.0"
pytest = "^6.1.2"
pytest-bdd = "^4.0.1"
pytest-cov = "^2.10.1"
isort = "^5.6.4"
flake8 = "^3.8.4"
pylint-junit = "^0.3.2"
coverage = "^6.1.1"
pytest-json-report = "^1.4.1"
pytest-forked = "^1.3.0"
pytest-mock = "^3.6.1"
pytest-xdist = "^2.4.0"
pytest-repeat = "^0.9.1"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 79

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
