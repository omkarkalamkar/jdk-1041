[tool.poetry]
name = "ska-tmc-centralnode-mid"
version = "0.3.0"
description = "Central Node is a coordinator of the complete M&C system"
authors = ["Team NCRA <telmgt-internal@googlegroups.com>"]
license = "BSD-3-Clause"
packages = [
    { include = "ska_tmc_centralnode_mid", from = "src" }
]

[tool.poetry.scripts]
CentralNodeDS = 'ska_tmc_centralnode_mid.central_node:main'

[[tool.poetry.source]]
name = 'ska-nexus'
url = 'https://artefact.skao.int/repository/pypi-internal/simple'

[tool.poetry.dependencies]
python = "^3.9"
jsonschema = "^4.0.1"
marshmallow = "^3.13.0"
fire = "^0.4.0"
numpy = "1.17.2"
pytango = "^9.3.3"
ska-ser-logging = "^0.4.1"
ska-tango-base = "0.11.3+5e1f0fee"
ska-tmc-cdm = "*"
ska-tmc-common = "*"
ska-ser-log-transactions = "*"
ska-ser-skuid = "*"

[tool.poetry.dev-dependencies]
black = "^20.8b1"
pylint = "^2.6.0"
pytest = "^6.1.2"
pytest-bdd = "^4.0.1"
pytest-cov = "^2.10.1"
isort = "^5.6.4"
flake8 = "^3.8.4"
pylint-junit = "^0.3.2"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 79

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
