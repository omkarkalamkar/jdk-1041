name: "mocks-{{.Release.Name}}"
function: testing
domain: mocks
instances: 
  - "csp-controller"
  - "sdp-controller"
  - "subarray-node-01"
  - "mccs-mln"
  - "mccs-controller"
  - "csp-sdp-subarray-01"
  - "sdp-mln"
  - "csp-mln"
  - "subarray-node-02"
  - "csp-sdp-subarray-02"
entrypoints:
  - name: "ska_tmc_simulators.helper_base_device.HelperBaseDevice"
  - name: "ska_tmc_simulators.helper_mccs_controller_device.HelperMCCSController"
  - name: "ska_tmc_simulators.helper_mccs_master_leaf_node_device.HelperMCCSMasterLeafNode"
  - name: "ska_tmc_simulators.helper_subarray_leaf_device.HelperSubarrayLeafDevice"
  - name: "ska_tmc_simulators.helper_csp_master_device.HelperCspMasterDevice"
  - name: "ska_tmc_simulators.helper_csp_master_leaf_node.HelperCspMasterLeafDevice"
  - name: "ska_tmc_simulators.helper_sdp_master_leaf_node.HelperSDPMasterLeafNode"
  - name: "ska_tmc_simulators.cn_helper_subarray_device.CNHelperSubArrayDevice"
server:
  name: "mocks"
  instances:
    - name: "csp-controller"
      classes:
      - name: "HelperCspMasterDevice"
        devices:
        - name: "low-csp/control/0"
    - name: "sdp-controller"
      classes:
      - name: "HelperBaseDevice"
        devices:
        - name: "low-sdp/control/0"
    - name: "subarray-node-01"
      classes:
      - name: "CNHelperSubArrayDevice"
        devices:
        - name: "low-tmc/subarray/01"
    - name: "mccs-mln"
      classes:
      - name: "HelperMCCSMasterLeafNode"
        devices:
        - name: "low-tmc/leaf-node-mccs/0"
    - name: "mccs-controller"
      classes:
      - name: "HelperMCCSController"
        devices:
        - name: "low-mccs/control/control"
    - name: "csp-sdp-subarray-01"
      classes:
      - name: "HelperSubarrayLeafDevice"
        devices:
        - name: "low-tmc/subarray-leaf-node-csp/01"
        - name: "low-tmc/subarray-leaf-node-sdp/01"
    - name: "sdp-mln"
      classes:
      - name: "HelperSDPMasterLeafNode"
        devices:
        - name: "low-tmc/leaf-node-sdp/0"
    - name: "csp-mln"
      classes:
      - name: "HelperCspMasterLeafDevice"
        devices:
        - name: "low-tmc/leaf-node-csp/0"
    - name: "subarray-node-02"
      classes:
      - name: "CNHelperSubArrayDevice"
        devices:
        - name: "low-tmc/subarray/02"
    - name: "csp-sdp-subarray-02"
      classes:
      - name: "HelperSubarrayLeafDevice"
        devices:
        - name: "low-tmc/subarray-leaf-node-csp/02"
        - name: "low-tmc/subarray-leaf-node-sdp/02"
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.ska_tmc_simulators.image.registry}}"
  image: "{{.Values.ska_tmc_simulators.image.image}}"
  tag: "{{.Values.ska_tmc_simulators.image.tag}}"
  pullPolicy: "{{.Values.ska_tmc_simulators.image.pullPolicy}}"
