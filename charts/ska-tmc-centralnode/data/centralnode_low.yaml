name: "centralnode-test"
function: telescope-monitoring
domain: general-monitoring
instances: ["01"]
command: "python3 /app/src/ska_tmc_centralnode/central_node_low.py"
server:
  name: "low_tmc_central_node"
  instances:
  - name: "01"
    classes:
    - name: "LowTmcCentralNode"
      devices:
      - name: "{{ $.Values.global.low.domain }}/{{ $.Values.deviceServers.centralnode.family }}/{{ $.Values.deviceServers.centralnode.member }}"
        properties:
        - name: "CspMasterLeafNodeFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.low.CspMasterLeafNodeFQDN}}"
        - name: "CspMasterFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.low.CspMasterFQDN}}"
        - name: "SdpMasterLeafNodeFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.low.SdpMasterLeafNodeFQDN}}"
        - name: "SdpMasterFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.low.SdpMasterFQDN}}"
        - name: "SkuidService"
          values:
          - "{{.Values.deviceServers.centralnode.SkuidService}}"
        - name: "MCCSMasterLeafNodeFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.low.MCCSMasterLeafNodeFQDN}}"
        - name: "MCCSMasterFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.low.MCCSMasterFQDN}}"
        - name: "CommandTimeOut"
          values:
          - "{{.Values.deviceServers.centralnode.low.CommandTimeOut}}"
        - name: "AssignResourcesInterface"
          values:
          - "{{.Values.deviceServers.centralnode.low.AssignResourcesInterface}}"
        - name: "ReleaseResourcesInterface"
          values:
          - "{{.Values.deviceServers.centralnode.low.ReleaseResourcesInterface}}"
        - name: "TMCSubarrayNodes"
          values:
          {{- range  ( regexSplit " " ((.Values.deviceServers.centralnode.subarray_count | int) | seq ) -1 )  }}
          - "ska_low/tm_subarray_node/{{ . }}"
          {{- end }}
        - name: "CspSubarrayLeafNodes"
          values:
          {{- range  ( regexSplit " " ((.Values.deviceServers.centralnode.subarray_count | int) | seq ) -1 )  }}
          - "ska_low/tm_leaf_node/csp_subarray{{ printf "%02s" . }}"
          {{- end }}
        - name: "SdpSubarrayLeafNodes"
          values:
          {{- range  ( regexSplit " " ((.Values.deviceServers.centralnode.subarray_count | int) | seq ) -1 )  }}
          - "ska_low/tm_leaf_node/sdp_subarray{{ printf "%02s" . }}"
          {{- end }}
        - name: "SkaLevel"
          values:
            - "1"
        - name: "LoggingTargetsDefault"
          values:
            - "tango::logger"
        - name: "LoggingLevelDefault"
          values:
            - "5"
        - name: "LivelinessCheckPeriod"
          values:
            - "{{.Values.deviceServers.centralnode.LivelinessCheckPeriod}}"
        - name: "EventSubscriptionCheckPeriod"
          values:
            - "{{.Values.deviceServers.centralnode.EventSubscriptionCheckPeriod}}"
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.centralnode.image.registry}}"
  image: "{{.Values.centralnode.image.image}}"
  tag: "{{.Values.centralnode.image.tag}}"
  pullPolicy: "{{.Values.centralnode.image.pullPolicy}}"

