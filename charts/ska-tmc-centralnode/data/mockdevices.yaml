name: "mocks-{{.Release.Name}}"
function: testing
domain: mocks
instances: ["01"]
entrypoints:
  - name: "ska_tmc_common.test_helpers.helper_base_device.HelperBaseDevice"
  - name: "ska_tmc_common.test_helpers.helper_mccs_controller_device.HelperMCCSController"
  - name: "ska_tmc_common.test_helpers.helper_mccs_master_leaf_node_device.HelperMCCSMasterLeafNode"
  - name: "ska_tmc_common.test_helpers.helper_subarray_leaf_device.HelperSubarrayLeafDevice"
  - name: "ska_tmc_common.test_helpers.helper_dish_device.HelperDishDevice"
  - name: "ska_tmc_common.test_helpers.helper_csp_master_device.HelperCspMasterDevice"
  - name: "cn_helper_subarray_device.CNHelperSubArrayDevice"
    path: "/app/tests/helpers/cn_helper_subarray_device.py"
server:
  name: "mocks"
  instances:
    - name: "01"
      classes:
      - name: "HelperCspMasterDevice"
        devices:
        - name: "mid-csp/control/0"
        - name: "low-csp/control/0"
        - name: "ska_mid/tm_leaf_node/csp_master"
      - name: "HelperBaseDevice"
        devices:
        - name: "ska_mid/tm_leaf_node/sdp_master"
        - name: "ska_low/tm_leaf_node/csp_master"
        - name: "ska_low/tm_leaf_node/sdp_master"
        - name: "mid-sdp/control/0"
        - name: "low-sdp/control/0"
      - name: "CNHelperSubArrayDevice"
        devices:
        - name: "ska_mid/tm_subarray_node/1"
        - name: "ska_low/tm_subarray_node/1"
      - name: "HelperMCCSMasterLeafNode"
        devices:
        - name: "ska_low/tm_leaf_node/mccs_master"
      - name: "HelperMCCSController"
        devices:
        - name: "low-mccs/control/control"
      - name: "HelperSubarrayLeafDevice"
        devices:
        - name: "ska_mid/tm_leaf_node/csp_subarray01"
        - name: "ska_mid/tm_leaf_node/sdp_subarray01"
        - name: "ska_low/tm_leaf_node/csp_subarray01"
        - name: "ska_low/tm_leaf_node/sdp_subarray01"
      - name: "HelperDishDevice"
        devices:
        - name: "ska001/dish/master"
        - name: "ska_mid/tm_leaf_node/d0001"
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.centralnodemid.image.registry}}"
  image: "{{.Values.centralnodemid.image.image}}"
  tag: "{{.Values.centralnodemid.image.tag}}"
  pullPolicy: "{{.Values.centralnodemid.image.pullPolicy}}"
