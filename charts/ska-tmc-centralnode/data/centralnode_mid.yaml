name: "centralnode-test"
function: telescope-monitoring
domain: general-monitoring
instances: ["01"]
{{- $DishMasterIdentifier := .Values.deviceServers.centralnode.mid.DishMasterIdentifier }}
{{- $KValueValidRangeUpperLimit := .Values.deviceServers.centralnode.mid.KValueValidRange.max | int }}
{{- $KValueValidRangeLowerLimit := .Values.deviceServers.centralnode.mid.KValueValidRange.min | int }}
{{- $LoggingLevel := .Values.deviceServers.centralnode.LoggingLevel }}


{{- if ge $KValueValidRangeUpperLimit $KValueValidRangeLowerLimit }}
entrypoints:
  - name: "ska_tmc_centralnode.central_node_mid.MidTmcCentralNode"
server:
  name: "central_node_mid"
  instances:
  - name: "01"
    classes:
    - name: "MidTmcCentralNode"
      devices:
      - name: "{{ $.Values.global.mid.domain }}/{{ $.Values.deviceServers.centralnode.family }}/{{ $.Values.deviceServers.centralnode.member }}"
        properties:
        - name: "CspMasterLeafNodeFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.mid.CspMasterLeafNodeFQDN}}"
        - name: "CspMasterFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.mid.CspMasterFQDN}}"
        - name: "SubarrayPrefix"
          values:
          - "{{.Values.deviceServers.centralnode.mid.SubarrayPrefix}}"
        - name: "SdpMasterLeafNodeFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.mid.SdpMasterLeafNodeFQDN}}"
        - name: "SdpMasterFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.mid.SdpMasterFQDN}}"
        - name: "DishLeafNodePrefix"
          values:
          - "{{.Values.deviceServers.centralnode.mid.DishLeafNodePrefix}}"
        - name: "DishMasterIdentifier"
          values:
          - "{{.Values.deviceServers.centralnode.mid.DishMasterIdentifier}}"
        - name: "DishVccUri"
          values:
          - "{{.Values.deviceServers.centralnode.mid.DishVccConfig.DishVccUri}}"
        - name: "DishVccFilePath"
          values:
          - "{{.Values.deviceServers.centralnode.mid.DishVccConfig.DishVccFilePath}}"
        - name: "EnableDishVccInit"
          values:
          - "{{.Values.deviceServers.centralnode.mid.EnableDishVccInit}}"
        - name: "DishKvalueAggregationAllowedPercent"
          values:
          - "{{.Values.deviceServers.centralnode.mid.DishKvalueAggregationAllowedPercent}}"
        - name: "DishVccInitTimeout"
          values:
          - "{{.Values.deviceServers.centralnode.mid.DishVccInitTimeout}}"
        - name: "CommandTimeOutDefault"
          values:
          - "{{.Values.deviceServers.centralnode.mid.CommandTimeOutDefault}}"
        - name: "DishIDs"
          values:
          {{- range  (.Values.deviceServers.centralnode.mid.DishIDs)  }}
          - "{{ . }}"
          {{- end }}
        - name: "DishMasterFQDNs"
          values:
          {{- range  (.Values.deviceServers.centralnode.mid.DishIDs)  }}
          - "{{ $DishMasterIdentifier }}/{{. | lower }}"
          {{- end }}
        - name: "TMCSubarrayNodes"
          values:
          {{- range  ( regexSplit " " ((.Values.deviceServers.centralnode.subarray_count | int) | seq ) -1 )  }}
          - "mid-tmc/subarray/{{ printf "%02s" . }}"
          {{- end }}
        - name: "CspSubarrayLeafNodes"
          values:
          {{- range  ( regexSplit " " ((.Values.deviceServers.centralnode.subarray_count | int) | seq ) -1 )  }}
          - "mid-tmc/subarray-leaf-node-csp/{{ printf "%02s" . }}"
          {{- end }}
        - name: "SdpSubarrayLeafNodes"
          values:
          {{- range  ( regexSplit " " ((.Values.deviceServers.centralnode.subarray_count | int) | seq ) -1 )  }}
          - "mid-tmc/subarray-leaf-node-sdp/{{ printf "%02s" . }}"
          {{- end }}
        - name: "KValueValidRangeUpperLimit"
          values:
          - "{{ $KValueValidRangeUpperLimit }}"
        - name: "KValueValidRangeLowerLimit"
          values:
          - "{{ $KValueValidRangeLowerLimit }}"
        - name: "SkaLevel"
          values:
            - "1"
        - name: "LoggingTargetsDefault"
          values:
            - "tango::logger"
        - name: "LoggingLevelDefault"
          values:
            - "{{ $LoggingLevel }}"
        - name: "LivelinessCheckPeriod"
          values:
            - "{{.Values.deviceServers.centralnode.LivelinessCheckPeriod}}"
        - name: "EventSubscriptionCheckPeriod"
          values:
            - "{{.Values.deviceServers.centralnode.EventSubscriptionCheckPeriod}}"
        - name: "GPMVersion"
          values:
          - "{{.Values.deviceServers.centralnode.mid.global_pointing_model.version}}"
        - name: "GPMInterface"
          values:
          - "{{.Values.deviceServers.centralnode.mid.global_pointing_model.interface}}"
        - name: "GPMFilePathPrefix"
          values:
          - "{{.Values.deviceServers.centralnode.mid.global_pointing_model.file_path_prefix}}"
        - name: "GPMDataSourcesPrefix"
          values:
          - "{{.Values.deviceServers.centralnode.mid.global_pointing_model.data_sources_prefix}}"
        - name: "DefaultArrayLayoutSourceURIs"
          values:
            - "{{.Values.deviceServers.centralnode.mid.DefaultArrayLayoutSourceURIs}}"
        - name: "DefaultArrayLayoutPath"
          values:
            - "{{.Values.deviceServers.centralnode.mid.DefaultArrayLayoutPath}}"
        - name: "MeerKatDishIdLowerLimit"
          values:
            - "{{.Values.deviceServers.centralnode.mid.MeerKatDishIdLowerLimit}}"
        - name: "MeerKatDishIdUpperLimit"
          values:
            - "{{.Values.deviceServers.centralnode.mid.MeerKatDishIdUpperLimit}}"
        - name: "SkaDishIdLowerLimit"
          values:
            - "{{.Values.deviceServers.centralnode.mid.SkaDishIdLowerLimit}}"
        - name: "SkaDishIdUpperLimit"
          values:
            - "{{.Values.deviceServers.centralnode.mid.SkaDishIdUpperLimit}}"
        

        
{{- else }}
{{- fail "KValueValidRangeUpperLimit should be greater than KValueValidRangeLowerLimit" }}
{{- end }}
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.centralnode.image.registry}}"
  image: "{{.Values.centralnode.image.image}}"
  tag: "{{.Values.centralnode.image.tag}}"
  pullPolicy: "{{.Values.centralnode.image.pullPolicy}}"