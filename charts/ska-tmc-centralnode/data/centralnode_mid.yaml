name: "centralnode-test"
function: telescope-monitoring
domain: general-monitoring
instances: ["01"]

{{- $DishMasterIdentifier := .Values.deviceServers.centralnode.mid.DishMasterIdentifier }}
{{- $KValueValidRangeUpperLimit := .Values.deviceServers.centralnode.mid.KValueValidRange.max | int }}
{{- $KValueValidRangeLowerLimit := .Values.deviceServers.centralnode.mid.KValueValidRange.min | int }}

{{- if ge $KValueValidRangeUpperLimit $KValueValidRangeLowerLimit }}
entrypoints:
  - name: "ska_tmc_centralnode.central_node_mid.CentralNodeMid"
server:
  name: "central_node_mid"
  instances:
  - name: "01"
    classes:
    - name: "CentralNodeMid"
      devices:
      - name: "ska_mid/tm_central/central_node"
        properties:
          - name: "CspMasterLeafNodeFQDN"
            values:
            - "{{.Values.deviceServers.centralnode.mid.CspMasterLeafNodeFQDN}}"
          - name: "CspMasterFQDN"
            values:
            - "{{.Values.deviceServers.centralnode.mid.CspMasterFQDN}}"
          - name: "SdpMasterLeafNodeFQDN"
            values:
            - "{{.Values.deviceServers.centralnode.mid.SdpMasterLeafNodeFQDN}}"
          - name: "SdpMasterFQDN"
            values:
            - "{{.Values.deviceServers.centralnode.mid.SdpMasterFQDN}}"
          - name: "DishLeafNodePrefix"
            values:
            - "{{.Values.deviceServers.centralnode.mid.DishLeafNodePrefix}}"
          - name: "KValueValidRangeUpperLimit"
            values:
            - "{{ $KValueValidRangeUpperLimit }}"
          - name: "KValueValidRangeLowerLimit"
            values:
            - "{{ $KValueValidRangeLowerLimit }}"
{{- else }}
{{- fail "KValueValidRangeUpperLimit should be greater than KValueValidRangeLowerLimit" }}
{{- end }}

depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.centralnode.image.registry}}"
  image: "{{.Values.centralnode.image.image}}"
  tag: "{{.Values.centralnode.image.tag}}"
  pullPolicy: "{{.Values.centralnode.image.pullPolicy}}"
