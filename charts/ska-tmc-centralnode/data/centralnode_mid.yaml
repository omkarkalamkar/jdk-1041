name: "centralnode-test"
function: telescope-monitoring
domain: general-monitoring
instances: ["01"]
entrypoints:
  - name: "ska_tmc_centralnode.central_node_mid.CentralNodeMid"
server:
  name: "central_node_mid"
  instances:
  - name: "01"
    classes:
    - name: "CentralNodeMid"
      devices:
      - name: "ska_mid/tm_central/central_node"
        properties:
        - name: "CspMasterLeafNodeFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.mid.CspMasterLeafNodeFQDN}}"
        - name: "CspMasterFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.mid.CspMasterFQDN}}"
        - name: "SdpMasterLeafNodeFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.mid.SdpMasterLeafNodeFQDN}}"
        - name: "SdpMasterFQDN"
          values:
          - "{{.Values.deviceServers.centralnode.mid.SdpMasterFQDN}}"
        - name: "DishLeafNodePrefix"
          values:
          - "{{.Values.deviceServers.centralnode.mid.DishLeafNodePrefix}}"
        - name: "NumDishes"
          values:
          - "{{.Values.deviceServers.centralnode.mid.NumDishes}}"
        - name: "SkuidService"
          values:
          - "{{.Values.deviceServers.centralnode.SkuidService}}"
        - name: "TMCSubarrayNodes"
          values:
          {{- range  ( regexSplit " " ((.Values.deviceServers.centralnode.subarray_count | int) | seq ) -1 )  }}
          - "ska_mid/tm_subarray_node/{{ . }}"
          {{- end }}
        - name: "TMCMidCspSubarrayLeafNodes"
          values:
          {{- range  ( regexSplit " " ((.Values.deviceServers.centralnode.subarray_count | int) | seq ) -1 )  }}
          - "ska_mid/tm_leaf_node/csp_subarray{{ printf "%02s" . }}"
          {{- end }}
        - name: "TMCMidSdpSubarrayLeafNodes"
          values:
          {{- range  ( regexSplit " " ((.Values.deviceServers.centralnode.subarray_count | int) | seq ) -1 )  }}
          - "ska_mid/tm_leaf_node/sdp_subarray{{ printf "%02s" . }}"
          {{- end }}
        - name: "SkaLevel"
          values:
            - "1"
        - name: "LoggingTargetsDefault"
          values:
            - "tango::logger"
        - name: "LoggingLevelDefault"
          values:
            - "5"
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.centralnodemid.image.registry}}"
  image: "{{.Values.centralnodemid.image.image}}"
  tag: "{{.Values.centralnodemid.image.tag}}"
  pullPolicy: "{{.Values.centralnodemid.image.pullPolicy}}"

