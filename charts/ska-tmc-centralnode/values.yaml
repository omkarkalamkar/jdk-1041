display: ":0"
xauthority: "~/.Xauthority"

enabled: true

system: SW-infrastructure
subsystem: ska-tmc-centralnode
telescope: SKA-mid

legacy_compatibility: true

subarray_count: 1
dishes: ["01"]

labels:
  app: ska-tmc-centralnode

global:
  minikube: true
  tango_host: databaseds-tango-base-test:10000
  retry:
    - "--tries=10"
    - "--sleep=5"

dsconfig:
  configuration_file: data/configuration.json
  timeout: 300s
  image:
    registry: artefact.skao.int
    image: ska-tango-images-tango-dsconfig
    tag: 1.5.12
    pullPolicy: IfNotPresent

itango:
  image:
    registry: artefact.skao.int
    image: ska-tango-images-tango-itango
    tag: 9.4.3
    pullPolicy: IfNotPresent

centralnode:
  image:
    registry: artefact.skao.int
    image: ska-tmc-centralnode
    tag: 0.16.8
    pullPolicy: IfNotPresent

resources:
  limits:

    memory: 500Mi
  requests:
    cpu: 150m
    memory: 400Mi

deviceServers:
  mocks:
    enabled: false
    mid:
      file: "data/mockdevices_mid.yaml"
    low:
      file: "data/mockdevices_low.yaml"

  centralnode:
    enabled: true
    instances: ["01"]
    subarray_count: 1
    SkuidService: "ska-ser-skuid-test-svc.ska-tmc-centralnode.svc.techops.internal.skao.int:9870"
    mid:
      file: "data/centralnode_mid.yaml"
      CspMasterLeafNodeFQDN: "ska_mid/tm_leaf_node/csp_master"
      CspMasterFQDN: "mid-csp/control/0"
      SdpMasterLeafNodeFQDN: "ska_mid/tm_leaf_node/sdp_master"
      SdpMasterFQDN: "mid-sdp/control/0"
      DishLeafNodePrefix: "ska_mid/tm_leaf_node/d0"
      DishMasterIdentifier: "elt/master"
      DishIDs: ["SKA001", "MKT001"]
      DishVccConfig:
        DishVccUri: "car://gitlab.com/ska-telescope/ska-tmc/ska-tmc-simulators?main#tmdata"
        DishVccFilePath: "instrument/dishid_vcc_map_configuration/mid_cbf_initial_parameters.json"
      EnableDishVccInit: "true"
      KValueValidRange:
        min: 1
        max: 1177
    low:
      file: "data/centralnode_low.yaml"
      CspMasterLeafNodeFQDN: "ska_low/tm_leaf_node/csp_master"
      CspMasterFQDN: "low-csp/control/0"
      SdpMasterLeafNodeFQDN: "ska_low/tm_leaf_node/sdp_master"
      SdpMasterFQDN: "low-sdp/control/0"
      MCCSMasterLeafNodeFQDN: "ska_low/tm_leaf_node/mccs_master"
      MCCSMasterFQDN: "low-mccs/control/control"
      AssignResourcesInterface: "https://schema.skao.int/ska-low-tmc-assignresources/4.0"
      ReleaseResourcesInterface: "https://schema.skao.int/ska-low-tmc-releaseresources/3.0"


nodeSelector: {}

affinity: {}

tolerations: []
