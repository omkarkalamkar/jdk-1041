display: ":0"
xauthority: "~/.Xauthority"

enabled: true

system: SW-infrastructure
subsystem: ska-tmc-centralnode
telescope: SKA-mid

legacy_compatibility: true

subarray_count: 1
dishes: ["01"]

labels:
  app: ska-tmc-centralnode

global:
  minikube: true
  tango_host: databaseds-tango-base-test:10000
  retry:
    - "--tries=10"
    - "--sleep=5"
  mid:
    domain: "mid-tmc"
  low:
    domain: "low-tmc"

dsconfig:
  configuration_file: data/configuration.json
  timeout: 300s
  image:
    registry: artefact.skao.int
    image: ska-tango-images-tango-dsconfig
    tag: 1.5.12
    pullPolicy: IfNotPresent

itango:
  image:
    registry: artefact.skao.int
    image: ska-tango-images-tango-itango
    tag: 9.4.3
    pullPolicy: IfNotPresent

centralnode:
  image:
    registry: artefact.skao.int
    image: ska-tmc-centralnode
    tag: 0.20.2
    pullPolicy: IfNotPresent

resources:
  limits:

    memory: 500Mi
  requests:
    cpu: 150m
    memory: 400Mi

deviceServers:
  mocks:
    enabled: false
    mid:
      file: "data/mockdevices_mid.yaml"
    low:
      file: "data/mockdevices_low.yaml"

  centralnode:
    enabled: true
    instances: ["01"]
    subarray_count: 1
    SkuidService: "ska-ser-skuid-test-svc.ska-tmc-centralnode.svc.techops.internal.skao.int:9870"
    LivelinessCheckPeriod: 1.0
    EventSubscriptionCheckPeriod: 1.0
    family: "central-node"
    member : "0"

    mid:
      file: "data/centralnode_mid.yaml"
      CspMasterLeafNodeFQDN: "mid-tmc/leaf-node-csp/0"
      CspMasterFQDN: "mid-csp/control/0"
      SdpMasterLeafNodeFQDN: "mid-tmc/leaf-node-sdp/0"
      SdpMasterFQDN: "mid-sdp/control/0"
      DishLeafNodePrefix: "mid-tmc/leaf-node-dish/"
      DishType: "ska"
      DishMasterIdentifier: "elt/master"
      DishIDs: ["SKA001", "MKT001", "SKA036", "SKA063", "SKA100"]
      DishVccConfig:
        DishVccUri: "car://gitlab.com/ska-telescope/ska-tmc/ska-tmc-simulators?main#tmdata"
        DishVccFilePath: "instrument/dishid_vcc_map_configuration/mid_cbf_initial_parameters.json"
      EnableDishVccInit: "true"
      KValueValidRange:
        min: 1
        max: 1177
      DishKvalueAggregationAllowedPercent: 100.0
      DishVccInitTimeout: 120
      CommandTimeOut: 30
      SubarrayPrefix: "mid-tmc/subarray/"
    low:
      file: "data/centralnode_low.yaml"
      CspMasterLeafNodeFQDN: "low-tmc/leaf-node-csp/0"
      CspMasterFQDN: "low-csp/control/0"
      SdpMasterLeafNodeFQDN: "low-tmc/leaf-node-sdp/0"
      SdpMasterFQDN: "low-sdp/control/0"
      MCCSMasterLeafNodeFQDN: "low-tmc/leaf-node-mccs/0"
      MCCSMasterFQDN: "low-mccs/control/control"
      CommandTimeOut: 30
      SubarrayPrefix: "low-tmc/subarray/"


nodeSelector: {}

affinity: {}

tolerations: []
