name: "centralnode-test"
function: telescope-monitoring
domain: general-monitoring
instances: ["01"]
command: "python3 /app/src/ska_tmc_centralnode_mid/central_node.py"
server:
  name: "central_node"
  instances:
  - name: "01"
    classes:
    - name: "CentralNode"
      devices:
      - name: "ska_mid/tm_central/central_node"
        properties:
        - name: "CspMasterLeafNodeFQDN"
          values:
          - "ska_mid/tm_leaf_node/csp_master"
        - name: "CspMasterFQDN"
          values:
          - "mid_csp/elt/master"
        - name: "SdpMasterLeafNodeFQDN"
          values:
          - "ska_mid/tm_leaf_node/sdp_master"
        - name: "SdpMasterFQDN"
          values:
          - "mid_sdp/elt/master"
        - name: "DishLeafNodePrefix"
          values:
          - "ska_mid/tm_leaf_node/d"
        - name: "TMMidSubarrayNodes"
          values:
          - "ska_mid/tm_subarray_node/1"
        - name: "TMMidCspSubarrayLeafNodes"
          values:
          - "ska_mid/tm_leaf_node/csp_subarray01"
        - name: "TMMidSdpSubarrayLeafNodes"
          values:
          - "ska_mid/tm_leaf_node/sdp_subarray01"
        - name: "NumDishes"
          values:
          - "1"
        - name: "SkaLevel"
          values:
            - "1"
        - name: "LoggingTargetsDefault"
          values:
            - "tango::logger"
        - name: "LoggingLevelDefault"
          values:
            - "5"
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.centralnodemid.image.registry}}"
  image: "{{.Values.centralnodemid.image.image}}"
  tag: "{{.Values.centralnodemid.image.tag}}"
  pullPolicy: "{{.Values.centralnodemid.image.pullPolicy}}"

