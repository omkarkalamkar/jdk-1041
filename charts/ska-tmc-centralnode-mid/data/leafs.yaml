name: "sdpsubarayleafnode-{{.Release.Name}}"
function: observation-execution
domain: subarray
instances: ["01"]
command: "python3 /app/tests/helper_state_device.py"
server:
  name: "Leafnodes"
  instances:
    - name: "01"
      classes:
        - name: "HelperStateDevice"
          devices:
            - name: "ska_mid/tm_leaf_node/csp_master"
            - name: "mid_csp/elt/master"
            - name: "ska_mid/tm_leaf_node/sdp_master"
            - name: "mid_sdp/elt/master"
            - name: "mid_d0001/elt/master"
            - name: "ska_mid/tm_leaf_node/d0001"
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.centralnodemid.image.registry}}"
  image: "{{.Values.centralnodemid.image.image}}"
  tag: "{{.Values.centralnodemid.image.tag}}"
  pullPolicy: "{{.Values.centralnodemid.image.pullPolicy}}"