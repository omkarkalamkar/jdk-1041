display: ":0"
xauthority: "~/.Xauthority"

global:
  retry: 
  - "--sleep=1"
  - "--tries=100"
  sub-system:
    ska-tango-base:
      enabled: false
  tango_host: databaseds-tango-base-test:10000
  dsconfig:
    timeout: 300s
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-dsconfig
      tag: 1.5.1
      pullPolicy: IfNotPresent
  itango:
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-itango
      tag: 9.3.5
      pullPolicy: IfNotPresent

ska-tango-base:
  vnc:
    replicas: 1
    enabled: false
  tangorest:
    enabled: true
    replicas: 1
  tangodb:
    use_pv: false

## SKUID
ska-ser-skuid:
  skuid:
    use_pv: false
    config:
      generator_id: mvp01

ska-tmc-centralnode-mid:
  deviceServers:
    leafs:
      enabled: true
      instances: ["01"]
      file: "data/leafs.yaml"
    subarrays:
      enabled: true
      instances: ["01"]
      file: "data/subarrays.yaml"
    centralnode:
      enabled: true
      instances: ["01"]
      file: "data/centralnode.yaml"