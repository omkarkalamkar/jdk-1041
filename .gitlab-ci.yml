image: $SKA_K8S_TOOLS_DOCKER_BUILDER_IMAGE

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  SKALLOP_VERSION: "2.7.4"

stages:
  - lint
  - join-reports
  - build
  - test
  - publish
  - pages
  - scan
  - lifecycle

join_linting_reports:
  stage: join-reports
  tags:
    - k8srunner
  script:
    - echo "This step is needed as the artifacts can't be passed in the same stage"
    - make join-lint-reports
  artifacts:
    paths:
      - build/
    when: always

include:
  # # # Helm Chart linting and Publish
  # Note: Commenting this part to Disable helm chart linting and Publish job from the pipeline
  # - project: 'ska-telescope/templates-repository'
  #   file: 'gitlab-ci/includes/helm-chart.gitlab-ci.yml'

  # # Python packages build,lint, test and publish
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/python.gitlab-ci.yml'

  # # OCI images build and publish
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/oci-image.gitlab-ci.yml'

  # # Docs pages
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/docs.gitlab-ci.yml'

  # k8s steps
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/k8s.gitlab-ci.yml'

  # Release Automation
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/release.gitlab-ci.yml'

  # Create Gitlab CI badges from CI metrics
  # https://developer.skatelescope.org/en/latest/tools/continuousintegration.html#automated-collection-of-ci-health-metrics-as-part-of-the-ci-pipeline
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/finaliser.gitlab-ci.yml'

# retry to template job for python-test
python-test:
  retry: 2

k8s-test:
  retry: 2
  variables:
    TELESCOPE: SKA-mid
  environment:
    name: test/$CI_COMMIT_REF_SLUG-mid
    kubernetes:
      namespace: ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-mid
  after_script:
    - &after_script |
        echo $CI_JOB_NAME - $CI_JOB_STAGE
        make k8s-uninstall-chart
        kubectl -n $KUBE_NAMESPACE delete pods,svc,daemonsets,deployments,replicasets,statefulsets,cronjobs,jobs,ingresses,configmaps --all
        make k8s-delete-namespace
        if [ -f build/cucumber.json ]; then
        pip3 install -U "ska-ser-skallop>=$SKALLOP_VERSION" --extra-index-url https://artefact.skao.int/repository/pypi-internal/simple
        /usr/local/bin/xtp-xray-upload -f build/cucumber.json -i test-exec.json -v
        fi
    - mv build build_k8s_test
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_ID"
    paths:
      - "build_k8s_test/"
    reports:
      junit: build_k8s_test/reports/unit-tests.xml
    when: always

low-k8s-test:
  retry: 2
  extends: k8s-test
  variables:
    TELESCOPE: SKA-low
  environment:
    name: test/$CI_COMMIT_REF_SLUG-low
    kubernetes:
      namespace: ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-low
  after_script:
    - *after_script
    - mv build build_low_k8s_test
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_ID"
    paths:
      - "build_low_k8s_test/"
    reports:
      junit: build_low_k8s_test/reports/unit-tests.xml
    when: always
