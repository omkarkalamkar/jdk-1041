# GitLab CI in conjunction with GitLab Runner can use Docker Engine to test and build any application.
# Docker, when used with GitLab CI, runs each job in a separate and isolated container using the predefined image that is set up in .gitlab-ci.yml.
# In this case we use the latest python docker image to build and test this project.
image: nexus.engageska-portugal.pt/ska-docker/ska-python-buildenv:9.3.3.1

include:
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/post_step.yml'

# cache is used to specify a list of files and directories which should be cached between jobs. You can only use paths that are within the project workspace.
# If cache is defined outside the scope of jobs, it means it is set globally and all jobs will use that definition
cache:
  paths:
    - build

# The YAML file defines a set of jobs with constraints stating when they should be run.
# You can specify an unlimited number of jobs which are defined as top-level elements with an arbitrary name and always have to contain at least the script clause.
# In this case we have only the test job which produce an artifacts (it must be placed into a directory called "public")
# It is also specified that only the master branch will be subject of this job.

stages:
  - build
  - test
  - linting
  - publish
  - pages
  - release

clean shell runner:
  stage: .pre
  tags:
    - docker-executor
  script:
    # Gitlab CI badges creation
    - rm -rf build/*

build wheel for publication: # Executed on a tag
  stage: build
  tags:
    - docker-executor
  script:
    - python3 setup.py egg_info -b+$CI_COMMIT_SHORT_SHA sdist bdist_wheel
  rules:
    - if: '$CI_COMMIT_TAG'
  artifacts:
    paths:
      - ./dist/

build wheel for development: # Executed on non-tagged commit
  stage: build
  tags:
    - docker-executor
  script:
    - python3 setup.py egg_info -b+dev.$CI_COMMIT_SHORT_SHA sdist bdist_wheel
  artifacts:
    paths:
      - ./dist/
          
# unit tests:
#   stage: test
#   image: nexus.engageska-portugal.pt/ska-docker/ska-python-buildenv:9.3.3.1
#   tags:
#     - docker-executor
#   script:
#     - tox -e py37
#   artifacts:
#     paths:
#       - ./build

linting:
  stage: linting
  image: nexus.engageska-portugal.pt/ska-docker/ska-python-buildenv:9.3.3.1
  tags:
    - docker-executor
  script:
    - make lint
  artifacts:
    paths:
      - ./build

publish to nexus:
  stage: publish
  tags:
    - docker-executor
  variables:
    TWINE_USERNAME: $TWINE_USERNAME
    TWINE_PASSWORD: $TWINE_PASSWORD
  script:
    - python3 -m pip install twine
    - twine upload --repository-url $PYPI_REPOSITORY_URL dist/*
  rules:
    # PyPI package release only on tags, and confirm semantic versioning of tag
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^((([0-9]+)\.([0-9]+)\.([0-9]+)(?:-([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?)(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?)$/'

release docker image:
  stage: release
  image: $SKA_K8S_TOOLS_DEPLOY_IMAGE
  before_script:
  - echo $CAR_OCI_REGISTRY_USERNAME
  - echo $CAR_OCI_REGISTRY_PASSWORD
  - docker login -u $CAR_OCI_REGISTRY_USERNAME -p $CAR_OCI_REGISTRY_PASSWORD $CAR_OCI_REGISTRY_HOST
  tags:
    - docker-executor
  script:
    - make release-centralnode USERNAME=$GITLAB_USER_NAME EMAILID=$GITLAB_USER_EMAIL # Publish tag on the gitlab and tagged image on Nexus
  when: manual
  # only:
  #   refs:
  #     - master

pages:
  stage: pages
  tags:
    - docker-executor
  only:
    - master
  script:
    - mv build public
    - mv public/reports/htmlcov/* public
  artifacts:
    paths:
      - public
  

# Standardised included jobs
include:
# Create Gitlab CI badges from CI metrics
# https://developer.skatelescope.org/en/latest/tools/continuousintegration.html#automated-collection-of-ci-health-metrics-as-part-of-the-ci-pipeline
- project: 'ska-telescope/templates-repository'
  file: 'gitlab-ci/includes/post_step.yml'