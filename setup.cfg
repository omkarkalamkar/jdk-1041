[metadata]
description-file = README.rst

[aliases]
# Define `python setup.py test`
test=pytest

[coverage:run]
branch = True
source = tmc.centralnode
data_file = code-coverage
debug = dataio,dataop

[tool:pytest]
testpaths = tests

addopts =
          --forked
          --json-report
          --json-report-file=build/reports/report.json
          --cov-branch
          --cov-report term
          --cov-report html:build/reports/htmlcov
          --cov-report xml:build/reports/code-coverage.xml
          --cov=tmc.centralnode
          --junitxml=build/reports/unit-tests.xml
          --verbose
          --dist loadscope --numprocesses auto


console_output_style = progress
junit_family = legacy

filterwarnings =
    ignore::DeprecationWarning
